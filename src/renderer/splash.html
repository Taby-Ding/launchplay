<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <title>影游快启 · 正在启动</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      background: #05070f;
      color: #eef2ff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start;
      user-select: none; -webkit-user-select: none;
    }
    /* 品牌横幅铺满主体, object-fit: cover 保证不留白边 */
    .banner {
      width: 100%; flex: 1 1 auto; min-height: 0;
      object-fit: cover; object-position: center;
      display: block;
    }
    .foot {
      flex: 0 0 auto; height: 52px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
      background: #05070f;
    }
    .bar { width: 180px; height: 3px; border-radius: 4px; background: rgba(255,255,255,.12); overflow: hidden; }
    .bar i {
      display: block; height: 100%; width: 40%; border-radius: 4px;
      background: linear-gradient(90deg, #6d8bff, #b18cff);
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide {
      0%   { transform: translateX(-110%); }
      100% { transform: translateX(360%); }
    }
    .tip { font-size: 10px; color: #8f9bc0; letter-spacing: 1px; }
  </style>
</head>
<body>
  <img class="banner" src="assets/splash.jpg" alt="影游快启" draggable="false" />
  <div class="foot">
    <div class="bar"><i></i></div>
    <div class="tip">正在准备你的大屏…</div>
  </div>
</body>
</html>
