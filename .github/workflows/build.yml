name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # 两个平台各自在原生 runner 上构建，这不是偷懒，是硬约束：
    #   - Windows 包只能在 Windows 上打（NSIS / signtool）
    #   - Linux AppImage 需要创建文件软链，Windows 普通用户没有该权限
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            artifact: LaunchPlay-windows-x64
          - name: linux-x64
            os: ubuntu-latest
            artifact: LaunchPlay-linux-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate icon
        run: npm run icon

      # ubuntu-latest 升到 24.04 后默认没有 libfuse2，而 appimagetool 本身
      # 就是个 AppImage，缺了它会在生成阶段直接失败（本地 Windows 打 AppImage
      # 是缺符号链接权限，CI 上是缺 FUSE，两个不同的坑）。
      - name: Linux runtime dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2

      - name: Build Windows (portable)
        if: runner.os == 'Windows'
        run: npm run dist:win
        env:
          # 本项目不做代码签名，别让 electron-builder 自动去翻系统证书
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # 安装版是应用内更新的载体：electron-builder 会同时产出 latest.yml，
      # 手机/应用内 electron-updater 靠它判断新版本。只有打 tag 时才需要，
      # 平时 main 分支构建跳过，省时间。
      - name: Build Windows (NSIS installer + latest.yml)
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        run: npm run dist:win:setup
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # tar.gz 是稳定产物，先单独构建；AppImage 万一失败也不能拖累它
      - name: Build Linux (tar.gz)
        if: runner.os == 'Linux'
        run: npx electron-builder --linux tar.gz --x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Build Linux (AppImage)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: npx electron-builder --linux AppImage --x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # 不挂载 FUSE，直接解包运行 appimagetool，再兜一层
          APPIMAGE_EXTRACT_AND_RUN: 1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.tar.gz
            release/latest.yml
          retention-days: 14
          if-no-files-found: error

  # 统一发布：两个构建 job 并发写同一个 Release 容易互相覆盖，
  # 改成等它们都结束后，把所有 artifact 汇总到一处一次性挂上去。
  # 即使某个 job 失败，也已经产出的文件仍然会发布，不会全军覆没。
  release:
    name: Publish Release
    needs: build
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: LaunchPlay-*
          path: dist
          merge-multiple: true

      - name: List files to publish
        run: ls -lh dist

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
