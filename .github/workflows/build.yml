name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # 两个平台各自在原生 runner 上构建，这不是偷懒，是硬约束：
    #   - Windows 包只能在 Windows 上打（NSIS / signtool）
    #   - Linux AppImage 需要创建文件软链，Windows 普通用户没有该权限
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            script: npm run dist:win
            artifact: LaunchPlay-windows-x64
            files: release/*.exe
          - name: linux-x64
            os: ubuntu-latest
            script: npm run dist:linux
            artifact: LaunchPlay-linux-x64
            files: |
              release/*.AppImage
              release/*.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate icon
        run: npm run icon

      - name: Build
        run: ${{ matrix.script }}
        env:
          # 本项目不做代码签名，别让 electron-builder 自动去翻系统证书
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          retention-days: 14
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
          generate_release_notes: true
          fail_on_unmatched_files: false
