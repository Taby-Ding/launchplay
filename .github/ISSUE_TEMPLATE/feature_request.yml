name: 功能建议
description: 提出一个新功能或改进想法
labels: [enhancement]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你希望在什么情况下用它？解决什么问题？
      placeholder: 我把这台电脑接在电视上，平时只用遥控器，希望……
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你的想法
      description: 你希望它怎么工作？如果有参考产品（Xbox 首页、Apple TV、Kodi 等）也可以说
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你现在是怎么绕过这个问题的？
  - type: checkboxes
    id: constraints
    attributes:
      label: 约束确认
      options:
        - label: 这个功能不需要引入新的运行时依赖（项目卖点之一是零依赖、体积小）
        - label: 我愿意提交 PR 实现它
